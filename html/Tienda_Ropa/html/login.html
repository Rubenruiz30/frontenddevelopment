<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Camifut - Login</title>

  <link rel="stylesheet" href="../css/common.css" />
  <link rel="stylesheet" href="../css/login.css" />
  <link rel="stylesheet" href="../../../Theme/Theme.css" />

  <style>
    /* Canvas del humo */
    #smoke_canvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      pointer-events: none;
      z-index: 9999;
    }
  </style>
</head>

<body>

  <!-- Canvas para el efecto humo -->
  <canvas id="smoke_canvas"></canvas>

  <!-- Header / Logo -->
  <header>
    <img src="../../../img/camiseta de futol.webp" alt="Camifut Logo" class="logo">
    <p>Camifut - Acceso</p>

    <div class="controls">
      <button type="button" class="theme-btn" data-theme="light">☀️ Light</button>
      <button type="button" class="theme-btn" data-theme="dark">🌙 Dark</button>
      <button type="button" class="theme-btn" data-theme="neon">🧪 Neon</button>
      <button type="button" class="theme-btn" data-theme="forest">🌲 Forest</button>
    </div>
  </header>

  <!-- Navegación -->
  <nav class="card">
    <ul class="names">
      <li><a href="login.html">Home</a></li>
      <li><a href="espana.html">España</a></li>
      <li><a href="../html/francia.html">Francia</a></li>
      <li><a href="../html/paris.html">Paris</a></li>
      <li><a href="../html/About.html">About</a></li>
      <li><a href="contact.html">Contacts</a></li>
      <li><a href="login.html">Login</a></li>
      <li><a href="carrito.html">carrito</a></li>
    </ul>
  </nav>

  <!-- Contenido principal -->
  <main>
    <article class="card">
      <h1>Iniciar sesión</h1>

      <form action="#" method="post" class="login-form">
        <div class="form-group">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" placeholder="example@camifut.com" required>
        </div>

        <div class="session-timer">
          Tiempo de sesión: <span id="timer">00:00:00</span>
        </div>

        <div class="form-group">
          <label for="password">Contraseña</label>
          <input type="password" id="password" name="password" placeholder="********" required>
        </div>

        <div class="form-group">
          <label>
            <input type="checkbox" name="remember">
            Recordarme
          </label>
        </div>

        <button type="submit">Entrar</button>

        <p style="margin-top: 12px;">
          ¿No tienes cuenta? <a href="#">Regístrate</a>
        </p>

        <p>
          <a href="#">¿Olvidaste tu contraseña?</a>
        </p>
      </form>
    </article>
  </main>

  <footer>
    <p>&copy; 2026 Camifut - Mundial 2026</p>
  </footer>

  <audio class="sonido" src="../html/chimes.mp3"></audio>

  <script src="../html/timer.js" defer></script>
  <script src="../../../Theme/theme.js" defer></script>
  <script src="../../../smoke/smoke.js" defer></script>

</body>
</html>
